name: Bug report
description: Report reproducible CapX behavior that is incorrect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve CapX. Do not attach private screenshots, folder names, bookmarks, credentials, or unrelated user data.

  - type: input
    id: version
    attributes:
      label: CapX version
      description: Use the version shown in Settings, or write "source" and include the commit.
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.5
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Mac architecture
      options:
        - Apple Silicon
        - Intel
        - Unknown
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the visible behavior and when it occurs.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use a new folder and synthetic images when possible.
      placeholder: |
        1. Launch CapX
        2. Choose an empty folder
        3. Save a synthetic PNG into it
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: displays
    attributes:
      label: Display setup
      description: For sidebar-placement problems, include display count, arrangement, scaling, and selected Display setting. Do not include serial numbers.

  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add sanitized logs or synthetic screenshots only. Drag files here if needed.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I reproduced this with the newest supported CapX version.
          required: true
        - label: I removed personal screenshots and sensitive paths from this report.
          required: true
